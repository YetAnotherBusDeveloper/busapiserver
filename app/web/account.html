<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YABus 帳戶中心</title>
  
  <!-- Load Roboto Font & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Import Maps for @material/web -->
  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>

  <!-- Import Material Web Components Modules -->
  <script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
    if (document.adoptedStyleSheets) {
      document.adoptedStyleSheets = [...document.adoptedStyleSheets, typescaleStyles.styleSheet];
    }
  </script>

  <style>
    :root {
      /* M3 Dark Palette */
      --md-sys-color-primary: #80f3d6;
      --md-sys-color-on-primary: #00382d;
      --md-sys-color-primary-container: #005142;
      --md-sys-color-on-primary-container: #9dfad7;
      --md-sys-color-secondary: #b0ccc2;
      --md-sys-color-on-secondary: #1b352e;
      --md-sys-color-surface: #0f1418;
      --md-sys-color-on-surface: #e1e3e0;
      --md-sys-color-surface-container: #202327;
      --md-sys-color-surface-container-high: #2a2d32;
      --md-sys-color-outline: #8a928f;
      --md-sys-color-outline-variant: #3f4946;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000a;
      --md-sys-color-on-error-container: #ffdad6;
    }

    * {
      box-sizing: border-box;
    }

    body, h1, h2, h3, p, ul, ol, li, form, label {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font-family: Roboto, system-ui, -apple-system, sans-serif;
      padding-bottom: 60px;
    }

    /* Header Styling */
    header {
      background-color: var(--md-sys-color-surface-container);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-title-section {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Page Layout */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      header {
        padding: 12px 16px;
        flex-direction: column;
        gap: 12px;
        align-items: stretch;
        text-align: center;
      }
      .header-title-section {
        flex-direction: column;
        gap: 8px;
      }
      .header-actions {
        justify-content: center;
      }
    }

    /* M3 Card Container Styling */
    .m3-card {
      background-color: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 16px; /* M3 Medium shape */
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .m3-card-title {
      color: var(--md-sys-color-primary);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .metric-item {
      background-color: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 12px;
      padding: 12px 16px;
    }

    .metric-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--md-sys-color-outline);
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 15px;
      font-weight: 500;
      word-break: break-all;
    }

    /* Notification Banner */
    .notice-banner {
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--md-sys-color-outline-variant);
      font-size: 14px;
      line-height: 1.6;
    }

    .notice-banner.tone-success {
      background-color: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.4);
      color: #34d399;
    }

    .notice-banner.tone-error {
      background-color: rgba(248, 113, 113, 0.1);
      border-color: rgba(248, 113, 113, 0.4);
      color: #f87171;
    }

    .notice-banner.tone-info {
      background-color: rgba(96, 165, 250, 0.1);
      border-color: rgba(96, 165, 250, 0.4);
      color: #60a5fa;
    }

    .notice-banner.tone-warning {
      background-color: rgba(251, 146, 60, 0.1);
      border-color: rgba(251, 146, 60, 0.4);
      color: #fb923c;
    }

    .empty {
      color: var(--md-sys-color-outline);
      font-size: 13px;
      text-align: center;
      padding: 24px;
      border: 1px dashed var(--md-sys-color-outline-variant);
      border-radius: 12px;
    }

    .mono {
      font-family: monospace;
    }

    /* Custom Dialog Content */
    #mergeDialog p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--md-sys-color-on-surface);
    }

    md-list-item {
      --md-list-item-hover-state-layer-color: rgba(255, 255, 255, 0.05);
      --md-list-item-label-text-color: var(--md-sys-color-on-surface);
      --md-list-item-supporting-text-color: var(--md-sys-color-outline);
    }
  </style>
</head>

<body>
  <header>
    <div class="header-title-section">
      <h1 class="md-typescale-title-large" style="font-weight:700;">YABus 帳戶中心</h1>
      <md-assist-chip id="heroBadge" label="尚未登入"></md-assist-chip>
    </div>
    <div class="header-actions">
      <md-outlined-button id="refreshButton">
        <md-icon slot="icon">refresh</md-icon>
        重新整理
      </md-outlined-button>
      <md-outlined-button id="logoutButton">
        <md-icon slot="icon">logout</md-icon>
        登出
      </md-outlined-button>
    </div>
  </header>

  <md-linear-progress id="loader" style="width: 100%; display: none;" indeterminate></md-linear-progress>

  <main class="container">
    <div id="noticeBanner" style="display: none;"></div>

    <!-- Admin portal links -->
    <div id="adminNavContainer" style="display: none;" class="m3-card">
      <h2 class="m3-card-title md-typescale-title-medium">
        <md-icon>admin_panel_settings</md-icon>
        管理員工具
      </h2>
      <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <md-filled-button id="btnAdminFeedbacks">
          <md-icon slot="icon">inbox</md-icon>
          意見回饋
        </md-filled-button>
        <md-filled-button id="btnAdminAnnouncements">
          <md-icon slot="icon">campaign</md-icon>
          公告管理
        </md-filled-button>
        <md-filled-button id="btnAdminUsers">
          <md-icon slot="icon">manage_accounts</md-icon>
          用戶管理
        </md-filled-button>
      </div>
    </div>

    <div class="grid-2">
      <section class="m3-card">
        <h2 class="m3-card-title md-typescale-title-medium">
          <md-icon>account_circle</md-icon>
          帳戶資訊
        </h2>
        <div class="metrics-grid" id="accountMetrics"></div>
        <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px;">
          <md-filled-button id="linkGoogleButton">連結 Google</md-filled-button>
          <md-filled-button id="linkDiscordButton">連結 Discord</md-filled-button>
          <md-outlined-button href="/oauth/connections">管理 AI 收藏授權</md-outlined-button>
          <md-outlined-button id="logoutAllButton" style="--md-outlined-button-outline-color: var(--md-sys-color-error); --md-outlined-button-label-text-color: var(--md-sys-color-error);">
            登出所有裝置
          </md-outlined-button>
        </div>
      </section>

      <section class="m3-card">
        <h2 class="m3-card-title md-typescale-title-medium">
          <md-icon>link</md-icon>
          已連結身份
        </h2>
        <div id="identityList" style="display: flex; flex-direction: column;"></div>
      </section>
    </div>

    <div class="grid-2">
      <section class="m3-card">
        <h2 class="m3-card-title md-typescale-title-medium">
          <md-icon>smartphone</md-icon>
          目前裝置
        </h2>
        <div id="currentDevice"></div>
      </section>

      <section class="m3-card">
        <h2 class="m3-card-title md-typescale-title-medium">
          <md-icon>devices</md-icon>
          已登入裝置
        </h2>
        <div id="deviceList" style="display: flex; flex-direction: column;"></div>
      </section>
    </div>
  </main>

  <!-- M3 Dialog for merging prompt -->
  <md-dialog id="mergeDialog">
    <div slot="headline">帳號合併確認</div>
    <form slot="content" id="mergeDialogContent" method="dialog"></form>
    <div slot="actions">
      <md-text-button id="cancelMergeButton" value="cancel">取消</md-text-button>
      <md-filled-button id="confirmMergeButton" value="confirm" style="--md-filled-button-container-color: var(--md-sys-color-error); --md-filled-button-label-text-color: #ffffff;">
        確認合併並刪除
      </md-filled-button>
    </div>
  </md-dialog>

  <script>
    const AUTH_TOKEN_COOKIE_NAME = "yabus_auth_token";
    const STORAGE_KEYS = Object.freeze({
      authSession: "yabus_auth_session",
      deviceKey: "yabus_device_key",
    });

    const state = {
      session: readSession() || restoreSessionFromCookie(),
      account: null,
      devices: [],
      notice: null,
      mergePreview: null,
      busy: false,
    };

    function uuidv4() {
      return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) =>
        (Number(c) ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (Number(c) / 4)))).toString(16)
      );
    }

    function ensureDeviceKey() {
      const stored = localStorage.getItem(STORAGE_KEYS.deviceKey);
      if (stored) {
        return stored;
      }
      const generated = uuidv4();
      localStorage.setItem(STORAGE_KEYS.deviceKey, generated);
      return generated;
    }

    function readSession() {
      const raw = localStorage.getItem(STORAGE_KEYS.authSession);
      if (!raw) {
        return null;
      }
      try {
        return JSON.parse(raw);
      } catch {
        localStorage.removeItem(STORAGE_KEYS.authSession);
        return null;
      }
    }

    function readAuthTokenCookie() {
      const prefix = `${AUTH_TOKEN_COOKIE_NAME}=`;
      const match = document.cookie.split("; ").find((entry) => entry.startsWith(prefix));
      if (!match) {
        return "";
      }
      return decodeURIComponent(match.slice(prefix.length));
    }

    function setAuthTokenCookie(token) {
      document.cookie = `${AUTH_TOKEN_COOKIE_NAME}=${encodeURIComponent(token)}; Path=/; Max-Age=2592000; SameSite=Lax`;
    }

    function clearAuthTokenCookie() {
      document.cookie = `${AUTH_TOKEN_COOKIE_NAME}=; Path=/; Max-Age=0; SameSite=Lax`;
    }

    function restoreSessionFromCookie() {
      const token = readAuthTokenCookie();
      if (!token) {
        return null;
      }
      const session = {
        token,
        accountId: "",
        deviceId: "",
        role: "user",
        provider: "",
        displayName: "",
        storedAt: Date.now(),
      };
      localStorage.setItem(STORAGE_KEYS.authSession, JSON.stringify(session));
      return session;
    }

    function writeSession(session) {
      state.session = session;
      if (!session) {
        localStorage.removeItem(STORAGE_KEYS.authSession);
        clearAuthTokenCookie();
        return;
      }
      localStorage.setItem(STORAGE_KEYS.authSession, JSON.stringify(session));
      setAuthTokenCookie(session.token);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function providerLabel(provider) {
      return provider === "google" ? "Google" : provider === "discord" ? "Discord" : provider || "Unknown";
    }

    function providerClass(provider) {
      return provider === "google" ? "google-badge" : provider === "discord" ? "discord-badge" : "";
    }

    function formatTime(epochSeconds) {
      if (!epochSeconds) {
        return "-";
      }
      return new Date(Number(epochSeconds) * 1000).toLocaleString("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function maskDeviceKey(value) {
      if (!value) {
        return "-";
      }
      if (value.length <= 18) {
        return value;
      }
      return `${value.slice(0, 8)}...${value.slice(-8)}`;
    }

    function authHeaders() {
      if (!state.session || !state.session.token) {
        return {};
      }
      return { Authorization: `Bearer ${state.session.token}` };
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      const isJson = (response.headers.get("content-type") || "").includes("application/json");
      const payload = isJson ? await response.json() : null;
      if (!response.ok) {
        if (response.status === 401) {
          writeSession(null);
          if (window.location.pathname === "/account") {
            window.location.replace("/auth");
          }
        }
        const message = payload && payload.detail ? payload.detail : `HTTP ${response.status}`;
        throw new Error(message);
      }
      return payload;
    }

    function setBusy(value) {
      state.busy = value;
      const loader = document.getElementById("loader");
      if (value) {
        loader.style.display = "block";
      } else {
        loader.style.display = "none";
      }
      renderButtons();
    }

    function setNotice(tone, title, message) {
      state.mergePreview = null;
      state.notice = { tone, title, message };
      renderNotice();
    }

    function clearNotice() {
      state.notice = null;
      state.mergePreview = null;
      renderNotice();
    }

    function parseFragment() {
      const params = new URLSearchParams(window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "");
      if (!window.location.hash) {
        return params;
      }
      history.replaceState(null, "", window.location.pathname + window.location.search);
      return params;
    }

    async function handleFragmentState() {
      const params = parseFragment();
      const error = params.get("error");
      if (error) {
        setNotice("error", "流程沒有完成", error);
        return;
      }

      const linkStatus = params.get("link_status");
      const provider = params.get("provider");
      const mergeToken = params.get("merge_token");

      if (linkStatus === "linked") {
        setNotice("success", "連結完成", `${providerLabel(provider)} 已掛到目前帳號。`);
        await refreshData();
        return;
      }

      if (linkStatus === "already_linked") {
        setNotice("info", "不需要再次連結", `${providerLabel(provider)} 已經在這個帳號上。`);
        await refreshData();
        return;
      }

      if (linkStatus === "merge_required" && mergeToken) {
        await loadMergePreview(mergeToken);
      }
    }

    async function refreshData() {
      if (!state.session || !state.session.token) {
        state.account = null;
        state.devices = [];
        render();
        return;
      }

      setBusy(true);
      try {
        const [account, devices] = await Promise.all([
          requestJson("/api/v1/auth/me", { headers: authHeaders() }),
          requestJson("/api/v1/auth/devices", { headers: authHeaders() }),
        ]);
        state.account = account;
        state.devices = devices.devices || [];
      } catch (error) {
        state.account = null;
        state.devices = [];
        setNotice("error", "無法載入帳戶資料", error.message || String(error));
      } finally {
        setBusy(false);
        render();
      }
    }

    async function startLink(provider) {
      setBusy(true);
      try {
        const payload = await requestJson(`/api/v1/auth/link/${provider}-start`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...authHeaders(),
          },
          body: JSON.stringify({ platform: "web" }),
        });
        window.location.href = payload.authorization_url;
      } catch (error) {
        setBusy(false);
        setNotice("error", "無法開始連結", error.message || String(error));
      }
    }

    async function loadMergePreview(mergeToken) {
      setBusy(true);
      try {
        const preview = await requestJson(`/api/v1/auth/link/pending?merge_token=${encodeURIComponent(mergeToken)}`, {
          headers: authHeaders(),
        });
        state.notice = null;
        state.mergePreview = {
          ...preview,
          merge_token: mergeToken,
        };
      } catch (error) {
        setNotice("error", "無法取得連結確認資訊", error.message || String(error));
      } finally {
        setBusy(false);
        renderNotice();
      }
    }

    async function confirmMerge() {
      if (!state.mergePreview) {
        return;
      }
      setBusy(true);
      try {
        const result = await requestJson("/api/v1/auth/link/confirm", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...authHeaders(),
          },
          body: JSON.stringify({ merge_token: state.mergePreview.merge_token }),
        });
        setNotice("success", "帳號已合併", `${providerLabel(result.provider)} 已被移到目前帳號，來源帳號已刪除。`);
        await refreshData();
      } catch (error) {
        setNotice("error", "無法完成合併", error.message || String(error));
      } finally {
        setBusy(false);
      }
    }

    async function logoutCurrentDevice() {
      if (!state.session || !state.session.token) {
        return;
      }
      setBusy(true);
      try {
        await requestJson("/api/v1/auth/logout", {
          method: "POST",
          headers: authHeaders(),
        });
        writeSession(null);
        state.account = null;
        state.devices = [];
        window.location.replace("/auth");
      } catch (error) {
        setNotice("error", "登出失敗", error.message || String(error));
      } finally {
        setBusy(false);
        render();
      }
    }

    async function logoutAllDevices() {
      if (!state.session || !state.session.token) {
        return;
      }
      if (!confirm("確定要登出所有裝置嗎？這會清除此裝置與其他所有工作階段。")) {
        return;
      }
      setBusy(true);
      try {
        await requestJson("/api/v1/auth/logout-all", {
          method: "POST",
          headers: authHeaders(),
        });
        writeSession(null);
        state.account = null;
        state.devices = [];
        window.location.replace("/auth");
      } catch (error) {
        setNotice("error", "無法登出所有裝置", error.message || String(error));
      } finally {
        setBusy(false);
        render();
      }
    }

    function renderHeroBadge() {
      const badge = document.getElementById("heroBadge");
      if (!state.session || !state.session.token) {
        badge.setAttribute("label", "尚未登入");
        return;
      }
      badge.setAttribute("label", `${providerLabel(state.session.provider)} / ${state.session.displayName || "已登入"}`);
    }

    // md-dialog is a custom element defined by the @material/web module, which
    // loads from a CDN and therefore may not have upgraded yet when render()
    // first runs. Calling show()/close() on the un-upgraded element throws, and
    // because renderNotice() runs first, that aborts the whole render and
    // leaves the page blank until something calls render() again. Defer the
    // call instead of letting it take the page down.
    function setMergeDialogOpen(open) {
      const dialog = document.getElementById("mergeDialog");
      if (!dialog) return;

      if (typeof dialog.show !== "function" || typeof dialog.close !== "function") {
        customElements.whenDefined("md-dialog").then(() => setMergeDialogOpen(open));
        return;
      }

      if (open) {
        dialog.show();
      } else {
        dialog.close();
      }
    }

    function renderNotice() {
      const banner = document.getElementById("noticeBanner");

      if (state.mergePreview) {
        const dialogContent = document.getElementById("mergeDialogContent");
        dialogContent.innerHTML = `
          <p style="margin-bottom: 12px;">這個 <strong>${escapeHtml(providerLabel(state.mergePreview.provider))}</strong> 帳號已經掛在別的 YABus 帳號上。</p>
          <p style="margin-bottom: 12px; color: var(--md-sys-color-error); font-weight: 500;">
            注意：若選擇合併，來源帳號 <span class="mono">${escapeHtml(state.mergePreview.source_account_id)}</span> 將會被永久刪除。
          </p>
          <p>
            該來源帳號目前有 ${escapeHtml(String((state.mergePreview.source_identities || []).length))} 個登入身份，且有 ${escapeHtml(String(state.mergePreview.active_device_count || 0))} 台登入中的裝置。
          </p>
        `;
        setMergeDialogOpen(true);
        return;
      } else {
        setMergeDialogOpen(false);
      }

      if (!state.notice) {
        banner.style.display = "none";
        banner.innerHTML = "";
        return;
      }

      banner.style.display = "block";
      banner.className = `notice-banner tone-${state.notice.tone}`;
      banner.innerHTML = `
        <strong style="display: block; margin-bottom: 4px;">${escapeHtml(state.notice.title)}</strong>
        <div>${escapeHtml(state.notice.message)}</div>
      `;
    }

    function renderAccountMetrics() {
      const root = document.getElementById("accountMetrics");
      if (!state.account) {
        root.innerHTML = "<div class=\"empty\">尚未取得帳戶資料。</div>";
        return;
      }

      const metrics = [
        ["帳號 ID", state.account.account_id],
        ["權限", state.account.role],
        ["建立時間", formatTime(state.account.created_at)],
        ["更新時間", formatTime(state.account.updated_at)],
      ];

      root.innerHTML = metrics.map(([label, value]) => `
        <article class="metric-item">
          <div class="metric-label">${escapeHtml(label)}</div>
          <div class="metric-value">${escapeHtml(value || "-")}</div>
        </article>
      `).join("");
    }

    function renderIdentities() {
      const root = document.getElementById("identityList");
      const identities = state.account && Array.isArray(state.account.identities) ? state.account.identities : [];
      if (!identities.length) {
        root.innerHTML = '<div class="empty">尚未連結任何 OAuth 身分。</div>';
        return;
      }
      root.innerHTML = `
        <md-list style="background: transparent; padding: 0;">
          ${identities.map((identity) => {
            const provider = identity.provider;
            const icon = provider === "google" ? "mail" : "forum";
            return `
              <md-list-item style="--md-list-item-hover-state-layer-color: transparent;">
                <span slot="headline">${escapeHtml(identity.display_name || providerLabel(identity.provider))}</span>
                <span slot="supporting-text">${escapeHtml(identity.email || "沒有 email")}</span>
                <span slot="trailing-supporting-text" style="color: var(--md-sys-color-primary); font-weight: bold;">
                  ${escapeHtml(providerLabel(identity.provider))}
                </span>
                <md-icon slot="start">${icon}</md-icon>
              </md-list-item>
              <md-divider></md-divider>
            `;
          }).join("")}
        </md-list>
      `;
    }

    function renderCurrentDevice() {
      const root = document.getElementById("currentDevice");
      if (!state.account || !state.account.device) {
        root.innerHTML = '<div class="empty">沒有目前裝置資訊。</div>';
        return;
      }
      const device = state.account.device;
      const deviceLabel = device.device_name ? `${escapeHtml(device.device_name)}（這台裝置）` : "這台裝置";
      root.innerHTML = `
        <md-list style="background: transparent; padding: 0;">
          <md-list-item style="--md-list-item-hover-state-layer-color: transparent;">
            <span slot="headline">${deviceLabel}</span>
            <span slot="supporting-text">
              金鑰：${escapeHtml(maskDeviceKey(device.device_key))}<br>
              建立：${escapeHtml(formatTime(device.created_at))}<br>
              最近活動：${escapeHtml(formatTime(device.last_seen_at))}
            </span>
            <md-icon slot="start">smartphone</md-icon>
          </md-list-item>
        </md-list>
      `;
    }

    function renderDevices() {
      const root = document.getElementById("deviceList");
      if (!state.devices.length) {
        root.innerHTML = '<div class="empty">尚未登入其他裝置。</div>';
        return;
      }
      root.innerHTML = `
        <md-list style="background: transparent; padding: 0;">
          ${state.devices.map((device) => {
            const isCurrent = device.is_current;
            return `
              <md-list-item style="--md-list-item-hover-state-layer-color: transparent;">
                <span slot="headline">${escapeHtml(device.device_name || "未知裝置")} ${isCurrent ? "（目前裝置）" : ""}</span>
                <span slot="supporting-text">
                  金鑰：${escapeHtml(maskDeviceKey(device.device_key))}<br>
                  最近活動：${escapeHtml(formatTime(device.token_last_used_at || device.last_seen_at))}
                </span>
                <md-icon slot="start">devices</md-icon>
              </md-list-item>
              <md-divider></md-divider>
            `;
          }).join("")}
        </md-list>
      `;
    }

    function renderButtons() {
      const linkedProviders = new Set((state.account && state.account.identities || []).map((identity) => identity.provider));
      const linkGoogleButton = document.getElementById("linkGoogleButton");
      const linkDiscordButton = document.getElementById("linkDiscordButton");
      const refreshButton = document.getElementById("refreshButton");
      const logoutButton = document.getElementById("logoutButton");
      const logoutAllButton = document.getElementById("logoutAllButton");

      linkGoogleButton.disabled = state.busy || linkedProviders.has("google");
      linkDiscordButton.disabled = state.busy || linkedProviders.has("discord");
      refreshButton.disabled = state.busy;
      logoutButton.disabled = state.busy;
      logoutAllButton.disabled = state.busy;

      linkGoogleButton.textContent = linkedProviders.has("google") ? "Google 已連結" : "連結 Google";
      linkDiscordButton.textContent = linkedProviders.has("discord") ? "Discord 已連結" : "連結 Discord";
    }

    function render() {
      renderHeroBadge();
      renderNotice();

      renderAccountMetrics();
      renderIdentities();
      renderCurrentDevice();
      renderDevices();
      renderButtons();

      const adminNav = document.getElementById("adminNavContainer");
      if (state.account && (state.account.role === "admin" || state.account.role === "mod")) {
        adminNav.style.display = "flex";
      } else {
        adminNav.style.display = "none";
      }
    }

    document.getElementById("refreshButton").addEventListener("click", refreshData);
    document.getElementById("linkGoogleButton").addEventListener("click", () => startLink("google"));
    document.getElementById("linkDiscordButton").addEventListener("click", () => startLink("discord"));
    document.getElementById("logoutButton").addEventListener("click", logoutCurrentDevice);
    document.getElementById("logoutAllButton").addEventListener("click", logoutAllDevices);

    // Dialog action listeners
    document.getElementById("confirmMergeButton").addEventListener("click", async () => {
      setMergeDialogOpen(false);
      await confirmMerge();
    });
    document.getElementById("cancelMergeButton").addEventListener("click", () => {
      setMergeDialogOpen(false);
      clearNotice();
    });

    // Navigation setup
    document.getElementById("btnAdminFeedbacks").addEventListener("click", () => window.location.href = "/admin/feedbacks");
    document.getElementById("btnAdminAnnouncements").addEventListener("click", () => window.location.href = "/admin/announcements");
    document.getElementById("btnAdminUsers").addEventListener("click", () => window.location.href = "/admin/user_manage");

    ensureDeviceKey();
    render();
    refreshData().then(handleFragmentState);
  </script>
</body>

</html>
